name: ShipProof
description: Run proof checks for AI-generated pull request changes.

inputs:
  github-token:
    description: GitHub token used to read PR files and create or update the ShipProof comment.
    required: true
  comment:
    description: Whether to create or update a pull request comment.
    required: false
    default: "true"
  report-path:
    description: Path where the markdown report should be written for artifact upload.
    required: false
    default: shipproof-report.md
  config-path:
    description: Optional path to a ShipProof JSON config file.
    required: false
    default: ""
  json-report-path:
    description: Path where the JSON report payload should be written for artifact upload.
    required: false
    default: shipproof-report.json
  security-sarif-path:
    description: Path where SARIF security-lite results should be written for artifact upload.
    required: false
    default: shipproof-security.sarif
  browser-smoke:
    description: Whether to run browser smoke checks when ShipProof detects a supported frontend.
    required: false
    default: "true"
  browser-base-url:
    description: Existing dev server URL to reuse. If omitted, ShipProof starts the detected dev server.
    required: false
    default: ""
  browser-ready-url:
    description: URL used to decide when the dev server is ready.
    required: false
    default: ""
  browser-timeout-ms:
    description: Browser navigation and readiness timeout in milliseconds.
    required: false
    default: ""
  browser-wait-until:
    description: Playwright waitUntil value for route navigation.
    required: false
    default: ""
  browser-log-dir:
    description: Directory for browser dev server stdout and stderr logs.
    required: false
    default: shipproof-browser-logs
  screenshot-dir:
    description: Directory for browser smoke screenshots.
    required: false
    default: shipproof-screenshots
  github-api-url:
    description: GitHub API base URL. Override for GitHub Enterprise or local integration verification.
    required: false
    default: https://api.github.com

runs:
  using: composite
  steps:
    - name: Run ShipProof
      shell: bash
      run: node "$GITHUB_ACTION_PATH/bin/shipproof.js" github
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_REPORT_PATH: ${{ inputs.report-path }}
        INPUT_CONFIG_PATH: ${{ inputs.config-path }}
        INPUT_JSON_REPORT_PATH: ${{ inputs.json-report-path }}
        INPUT_SECURITY_SARIF_PATH: ${{ inputs.security-sarif-path }}
        INPUT_BROWSER_SMOKE: ${{ inputs.browser-smoke }}
        INPUT_BROWSER_BASE_URL: ${{ inputs.browser-base-url }}
        INPUT_BROWSER_READY_URL: ${{ inputs.browser-ready-url }}
        INPUT_BROWSER_TIMEOUT_MS: ${{ inputs.browser-timeout-ms }}
        INPUT_BROWSER_WAIT_UNTIL: ${{ inputs.browser-wait-until }}
        INPUT_BROWSER_LOG_DIR: ${{ inputs.browser-log-dir }}
        INPUT_SCREENSHOT_DIR: ${{ inputs.screenshot-dir }}
        INPUT_GITHUB_API_URL: ${{ inputs.github-api-url }}
